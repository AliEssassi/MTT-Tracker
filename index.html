<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>MTT Tracker</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --card: #fff;
        --tx: #14171f;
        --mu: #6b7280;
        --bd: #e3e6ec;
        --ac: #2f6fed;
        --pos: #16a34a;
        --neg: #dc2626;
        --turbo: #c026d3;
        --bpc: #16a34a;
        --deep: #d99a06;
        --inter: #2f6fed;
        --p0: #2f6fed;
        --p1: #f59e0b;
        --p2: #16a34a;
        --p3: #c026d3;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1116;
          --card: #181c24;
          --tx: #eceff4;
          --mu: #98a1b2;
          --bd: #2a303c;
          --ac: #5b8cff;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1116;
        --card: #181c24;
        --tx: #eceff4;
        --mu: #98a1b2;
        --bd: #2a303c;
        --ac: #5b8cff;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding-bottom: 80px;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 12px;
      }
      h1 {
        font-size: 20px;
        margin: 6px 0 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--mu);
        margin: 18px 4px 8px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 12px;
        margin-bottom: 8px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .chips {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 2px 0 8px;
      }
      .chip,
      .seg button {
        border: 1px solid var(--bd);
        background: var(--card);
        color: var(--tx);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 13px;
        white-space: nowrap;
        cursor: pointer;
      }
      .chip.on,
      .seg button.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      .seg {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      .seg button {
        flex: 1;
      }
      .date {
        width: 46px;
        text-align: center;
        border-radius: 10px;
        padding: 5px 0;
        color: #fff;
        flex: none;
      }
      .date b {
        display: block;
        font-size: 20px;
        line-height: 1;
      }
      .date span {
        font-size: 11px;
        text-transform: uppercase;
      }
      .name {
        font-weight: 600;
      }
      .sub {
        color: var(--mu);
        font-size: 13px;
      }
      .tag {
        display: inline-block;
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 999px;
        color: #fff;
        margin-right: 4px;
      }
      .pos {
        color: var(--pos);
      }
      .neg {
        color: var(--neg);
      }
      .mono {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .tap {
        cursor: pointer;
      }
      .past {
        opacity: 0.75;
      }
      .next {
        outline: 2px solid var(--ac);
      }
      nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--card);
        border-top: 1px solid var(--bd);
        display: flex;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        z-index: 5;
      }
      nav button {
        flex: 1;
        border: 0;
        background: none;
        color: var(--mu);
        padding: 10px 0 8px;
        font-size: 12px;
        cursor: pointer;
      }
      nav button.on {
        color: var(--ac);
        font-weight: 700;
      }
      nav i {
        display: block;
        font-style: normal;
        font-size: 20px;
      }
      .fab {
        position: fixed;
        right: 16px;
        bottom: calc(72px + env(safe-area-inset-bottom, 0px));
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 0;
        background: var(--ac);
        color: #fff;
        font-size: 28px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        z-index: 6;
        cursor: pointer;
      }
      .sheet-bg {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 10;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .sheet {
        background: var(--bg);
        width: 100%;
        max-width: 560px;
        max-height: 92%;
        overflow: auto;
        border-radius: 18px 18px 0 0;
        padding: 16px 14px calc(16px + env(safe-area-inset-bottom, 0px));
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--mu);
        margin: 8px 0 3px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid var(--bd);
        background: var(--card);
        color: var(--tx);
        font: inherit;
      }
      .g3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .btn {
        border: 0;
        border-radius: 10px;
        padding: 12px;
        font: inherit;
        font-weight: 600;
        background: var(--ac);
        color: #fff;
        width: 100%;
        cursor: pointer;
        margin-top: 12px;
      }
      .btn.alt {
        background: var(--card);
        color: var(--tx);
        border: 1px solid var(--bd);
      }
      .btn.del {
        background: var(--neg);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 8px;
        text-align: center;
      }
      .stats div {
        background: var(--bg);
        border-radius: 10px;
        padding: 8px 2px;
      }
      .stats b {
        display: block;
        font-size: 16px;
      }
      .stats span {
        font-size: 11px;
        color: var(--mu);
      }
      svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .chk {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        color: var(--tx);
      }
      .chk input {
        width: 20px;
        height: 20px;
      }
      .empty {
        text-align: center;
        color: var(--mu);
        padding: 24px 0;
      }
      .pr{display:flex;gap:8px;align-items:center;margin-top:8px}
      .pr .nm{flex:1;font-weight:600}
      .ib{display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);background:var(--card);border-radius:10px;width:40px;height:40px;cursor:pointer;padding:0}
      .ib svg{width:18px;height:18px}
      .ib.ed{color:var(--ac)}
      .ib.dl{color:var(--neg)}
      .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--neg);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:90%}
      .map{display:block;width:100%;text-align:center;border-radius:10px;padding:10px;font:inherit;font-weight:600;background:var(--card);color:var(--ac);border:1px solid var(--bd);margin-top:10px;cursor:pointer}
      .pin{text-decoration:none;font-size:12px;margin-left:6px;color:var(--ac)}
    </style>
  </head>
  <body>
    <main id="app"></main>
    <button class="fab" id="fab" aria-label="Ajouter un tournoi interclub">
      +
    </button>
    <nav>
      <button data-t="cal"><i>📅</i>Tournois</button>
      <button data-t="stats"><i>📊</i>Stats</button>
      <button data-t="set"><i>⚙️</i>Réglages</button>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script>
      const TYPES = {
        turbo: ["Turbo", "--turbo"],
        bpc: ["BPC Challenge", "--bpc"],
        deep: ["Deepstacks interclubs", "--deep"],
        inter: ["Interclub", "--inter"],
      };
      const SEED = [
        ["2026-09-18", "turbo"],
        ["2026-09-20", "bpc"],
        ["2026-10-16", "turbo"],
        ["2026-10-25", "bpc"],
        ["2026-10-30", "turbo"],
        ["2026-11-20", "turbo"],
        ["2026-11-28", "deep"],
        ["2026-12-06", "bpc"],
        ["2026-12-11", "turbo"],
        ["2027-01-15", "turbo"],
        ["2027-01-31", "bpc"],
        ["2027-02-12", "turbo"],
        ["2027-02-26", "turbo"],
        ["2027-03-14", "bpc"],
        ["2027-03-19", "turbo"],
        ["2027-03-26", "turbo"],
        ["2027-04-03", "deep"],
        ["2027-04-04", "deep"],
        ["2027-04-11", "bpc"],
        ["2027-04-23", "turbo"],
        ["2027-05-22", "deep"],
        ["2027-05-30", "bpc"],
        ["2027-06-11", "turbo"],
      ];
      const SB_URL = "https://nxmrrfwcyacconcduaxq.supabase.co",
        SB_KEY = "sb_publishable_8gfF8MZyvbmLljNyqj9J9w_EkIc5P31";
      const sb = supabase.createClient(SB_URL, SB_KEY);
      let S = { players: [], custom: [], results: {} },
        loadErr = false,
        authed = false,
        authReady = false;
      async function load() {
        if (!authed) return;
        const [p, c, r] = await Promise.all([
          sb.from("players").select("*").order("created_at"),
          sb.from("custom_tournaments").select("*"),
          sb.from("results").select("*"),
        ]);
        loadErr = !!(p.error || c.error || r.error);
        if (!loadErr) {
          S.players = p.data.map((x) => ({ id: x.id, name: x.name }));
          S.custom = c.data.map((x) => ({
            id: x.id,
            date: x.date,
            type: "inter",
            name: x.name,
            place: x.place,
            custom: true,
          }));
          S.results = {};
          r.data.forEach((x) => {
            (S.results[x.tournament_id] ??= { n: x.n_players ?? "", p: {} }).p[
              x.player_id
            ] = {
              buyin: x.buyin ?? "",
              gain: x.gain ?? "",
              place: x.place ?? "",
            };
          });
        }
        render();
      }
      let tab = "cal",
        view = "next",
        filter = "all",
        sp = null;
      const $ = (s) => document.querySelector(s),
        app = $("#app");
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const num = (v) => parseFloat(String(v).replace(",", ".")) || 0;
      const eur = (v) =>
        (v > 0 ? "+" : "") +
        (Math.round(v * 100) / 100).toString().replace(".", ",") +
        " €";
      const cls = (v) => (v > 0 ? "pos" : v < 0 ? "neg" : "");
      const today = () => new Date().toISOString().slice(0, 10);
      const D = (d) => new Date(d + "T12:00");
      const all = () =>
        [
          ...SEED.map(([date, type]) => ({
            id: "s" + date,
            date,
            type,
            name: TYPES[type][0],
            place: "Bourges",
          })),
          ...S.custom,
        ].sort((a, b) => a.date.localeCompare(b.date));
      const res = (t, p) => (S.results[t.id] || {}).p?.[p.id];
      const prof = (r) => (r ? num(r.gain) - num(r.buyin) : 0);
      const IC = {
        edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
        del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/></svg>',
      };
      function toast(m) {
        const d = document.createElement("div");
        d.className = "toast";
        d.textContent = m;
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 2800);
      }
      const mapUrl = (q) => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
      const SH = { turbo: "Turbo", bpc: "BPC", deep: "Deepstack", inter: "Interclub" };

      function calView() {
        const now = today(),
          list = all().filter(
            (t) =>
              (filter === "all" || t.type === filter) &&
              (view === "all" ||
                (view === "next" ? t.date >= now : t.date < now)),
          );
        const nextId = all().find((t) => t.date >= now)?.id;
        let h =
          '<h1>♠️ MTT Tracker</h1><div class="seg">' +
          [
            ["next", "À venir"],
            ["past", "Passés"],
            ["all", "Tout"],
          ]
            .map(
              ([k, l]) =>
                `<button data-v="${k}" class="${view === k ? "on" : ""}">${l}</button>`,
            )
            .join("") +
          "</div>";
        h +=
          '<div class="chips"><button class="chip ' +
          (filter === "all" ? "on" : "") +
          '" data-f="all">Tous</button>' +
          Object.entries(TYPES)
            .map(
              ([k, v]) =>
                `<button class="chip ${filter === k ? "on" : ""}" data-f="${k}">${v[0]}</button>`,
            )
            .join("") +
          "</div>";
        if (!list.length) h += '<div class="empty">Aucun tournoi ici.</div>';
        let m = "";
        list.forEach((t) => {
          const mm = D(t.date).toLocaleDateString("fr-FR", {
            month: "long",
            year: "numeric",
          });
          if (mm !== m) {
            h += `<h2>${mm}</h2>`;
            m = mm;
          }
          const d = D(t.date),
            ty = TYPES[t.type];
          const sm = S.players
            .map((p) => {
              const r = res(t, p);
              return r
                ? `<span class="mono ${cls(prof(r))}">${esc(p.name)} ${eur(prof(r))}${r.place ? " · " + r.place + "e" : ""}</span>`
                : "";
            })
            .filter(Boolean)
            .join(" &nbsp; ");
          h += `<div class="card row tap ${t.id === nextId ? "next" : ""} ${t.date < now ? "past" : ""}" data-t="${t.id}"><div class="date" style="background:var(${ty[1]})"><span>${d.toLocaleDateString("fr-FR", { weekday: "short" })}</span><b>${d.getDate()}</b></div><div class="grow"><div class="name">${esc(t.name)}</div><div><span class="tag" style="background:var(${ty[1]})">${ty[0]}</span><span class="sub">${esc(t.place || "")}</span>${t.place ? `<a class="pin" href="${mapUrl(t.place)}" target="_blank" rel="noopener">📍 Maps</a>` : ""}</div>${sm ? `<div class="sub" style="margin-top:3px">${sm}</div>` : ""}</div></div>`;
        });
        return h;
      }

      function statsFor(p) {
        const rows = all()
          .map((t) => ({ t, r: res(t, p) }))
          .filter((x) => x.r);
        const bi = rows.reduce((a, x) => a + num(x.r.buyin), 0),
          pr = rows.reduce((a, x) => a + prof(x.r), 0);
        const itm = rows.filter((x) => num(x.r.gain) > 0).length,
          places = rows.map((x) => num(x.r.place)).filter((v) => v > 0);
        return {
          rows,
          n: rows.length,
          bi,
          pr,
          roi: bi ? (pr / bi) * 100 : 0,
          itm: rows.length ? (itm / rows.length) * 100 : 0,
          best: places.length ? Math.min(...places) : null,
          avg: places.length
            ? places.reduce((a, b) => a + b, 0) / places.length
            : null,
        };
      }
      function chart() {
        const ts = all().filter((t) => S.players.some((p) => res(t, p)));
        if (ts.length < 1)
          return '<div class="empty">Enregistre un résultat pour voir la courbe de profit.</div>';
        const W = 320,
          H = 160,
          pd = 28,
          series = S.players.map((p) => {
            let c = 0;
            return ts.map((t) => {
              c += prof(res(t, p));
              return c;
            });
          });
        const vals = series.flat().concat(0),
          mn = Math.min(...vals),
          mx = Math.max(...vals),
          rg = mx - mn || 1;
        const X = (i) =>
            pd +
            (ts.length > 1
              ? (i * (W - pd - 8)) / (ts.length - 1)
              : (W - pd - 8) / 2),
          Y = (v) => 8 + (H - 24) * (1 - (v - mn) / rg);
        let s = `<svg viewBox="0 0 ${W} ${H}"><line x1="${pd}" x2="${W - 8}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--bd)" stroke-dasharray="3"/><text x="2" y="${Y(0) + 4}" fill="var(--mu)" font-size="10">0</text><text x="2" y="14" fill="var(--mu)" font-size="10">${Math.round(mx)}</text><text x="2" y="${H - 12}" fill="var(--mu)" font-size="10">${Math.round(mn)}</text>`;
        series.forEach((ser, k) => {
          s +=
            `<polyline fill="none" stroke="var(--p${k % 4})" stroke-width="2.5" points="${ser.map((v, i) => X(i) + "," + Y(v)).join(" ")}"/>` +
            ser
              .map(
                (v, i) =>
                  `<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="var(--p${k % 4})"/>`,
              )
              .join("");
        });
        return (
          s +
          '</svg><div class="row" style="justify-content:center;gap:16px;font-size:13px">' +
          S.players
            .map(
              (p, k) =>
                `<span><b style="color:var(--p${k % 4})">●</b> ${esc(p.name)}</span>`,
            )
            .join("") +
          "</div>"
        );
      }
      function hbars(it, fm) {
        const mn = Math.min(0, ...it.map((i) => i.v)),
          mx = Math.max(0, ...it.map((i) => i.v)),
          rg = mx - mn || 1,
          x0 = 64,
          w = 190,
          rh = 26,
          X = (v) => x0 + (w * (v - mn)) / rg;
        return `<svg viewBox="0 0 320 ${it.length * rh}">` + it.map((i, n) => {
          const a = X(Math.min(0, i.v)), b = X(Math.max(0, i.v)), y = n * rh;
          return `<text x="0" y="${y + 17}" fill="var(--tx)" font-size="11">${esc(i.l.slice(0, 10))}</text><rect x="${a}" y="${y + 5}" width="${Math.max(b - a, 1.5)}" height="16" rx="3" fill="${i.c}"/><text x="316" y="${y + 17}" text-anchor="end" fill="var(--tx)" font-size="11" font-weight="600">${fm(i.v)}</text>`;
        }).join("") + "</svg>";
      }
      function vbars(it) {
        const W = 320, H = 150, pd = 8,
          mn = Math.min(0, ...it.map((i) => i.v)),
          mx = Math.max(0, ...it.map((i) => i.v)),
          rg = mx - mn || 1,
          Y = (v) => 8 + (H - 32) * (1 - (v - mn) / rg),
          st = (W - 2 * pd) / it.length,
          bw = Math.min(28, st - 4);
        return `<svg viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--bd)"/>` + it.map((i, n) => {
          const x = pd + st * n + (st - bw) / 2, y1 = Y(Math.max(0, i.v)), y2 = Y(Math.min(0, i.v));
          return `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(y2 - y1, 1.5)}" rx="2" fill="var(${i.v >= 0 ? "--pos" : "--neg"})"/>` +
            (it.length <= 14 ? `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle" fill="var(--mu)" font-size="8">${i.l.slice(8)}/${i.l.slice(5, 7)}</text>` : "");
        }).join("") + "</svg>";
      }
      function lsvg(pts, c) {
        if (!pts.length) return '<div class="empty">Aucune place saisie.</div>';
        const W = 320, H = 140, pd = 28,
          mx = Math.max(2, ...pts.map((p) => p.v)),
          X = (i) => pd + (pts.length > 1 ? (i * (W - pd - 8)) / (pts.length - 1) : (W - pd - 8) / 2),
          Y = (v) => 10 + (H - 24) * ((v - 1) / (mx - 1));
        return `<svg viewBox="0 0 ${W} ${H}"><text x="2" y="14" fill="var(--mu)" font-size="10">1er</text><text x="2" y="${H - 12}" fill="var(--mu)" font-size="10">${mx}e</text><polyline fill="none" stroke="${c}" stroke-width="2.5" points="${pts.map((p, i) => X(i) + "," + Y(p.v)).join(" ")}"/>` +
          pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p.v)}" r="3.5" fill="${c}"/>`).join("") + "</svg>";
      }
      function kpiView() {
        const st = S.players.map((p, k) => ({ p, k, s: statsFor(p) })).filter((x) => x.s.n);
        if (!st.length) return "";
        const pct = (v) => Math.round(v) + "%",
          K = [
            ["Profit total", (x) => x.s.pr, eur],
            ["ROI", (x) => x.s.roi, pct],
            ["ITM (tournois payés)", (x) => x.s.itm, pct],
            ["Profit moyen par tournoi", (x) => x.s.pr / x.s.n, eur],
            ["Place moyenne (plus bas = mieux)", (x) => x.s.avg ?? 0, (v) => (v ? v.toFixed(1).replace(".", ",") : "–")],
          ];
        return "<h2>Comparatif par KPI</h2>" + K.map(([t, f, fm]) => `<div class="card"><div class="sub" style="margin-bottom:4px">${t}</div>${hbars(st.map((x) => ({ l: x.p.name, v: f(x), c: `var(--p${x.k % 4})` })), fm)}</div>`).join("");
      }
      function playerView() {
        if (!S.players.length) return "";
        const p = S.players.find((x) => x.id === sp) || S.players[0],
          k = S.players.indexOf(p),
          s = statsFor(p),
          c = `var(--p${k % 4})`;
        let h = '<h2>Par joueur</h2><div class="chips">' + S.players.map((x) => `<button class="chip ${x.id === p.id ? "on" : ""}" data-sp="${x.id}">${esc(x.name)}</button>`).join("") + "</div>";
        if (!s.n) return h + '<div class="empty">Aucun résultat pour ce joueur.</div>';
        const by = {};
        s.rows.forEach((x) => (by[x.t.type] = (by[x.t.type] || 0) + prof(x.r)));
        return h +
          '<div class="card"><div class="sub">Profit par tournoi</div>' + vbars(s.rows.map((x) => ({ l: x.t.date, v: prof(x.r) }))) + "</div>" +
          '<div class="card"><div class="sub" style="margin-bottom:4px">Profit par type de tournoi</div>' + hbars(Object.entries(by).map(([t, v]) => ({ l: SH[t], v, c: `var(${TYPES[t][1]})` })), eur) + "</div>" +
          '<div class="card"><div class="sub">Place au fil des tournois</div>' + lsvg(s.rows.filter((x) => num(x.r.place) > 0).map((x) => ({ l: x.t.date, v: num(x.r.place) })), c) + "</div>";
      }
      function statsView() {
        const st = S.players
          .map((p) => ({ p, s: statsFor(p) }))
          .sort((a, b) => b.s.pr - a.s.pr);
        let h = "<h1>📊 Stats</h1><h2>Classement (profit)</h2>";
        st.forEach((x, i) => {
          h += `<div class="card"><div class="row"><div class="name grow">${["🥇", "🥈", "🥉"][i] || i + 1 + "."} ${esc(x.p.name)}</div><div class="mono ${cls(x.s.pr)}" style="font-size:18px">${eur(x.s.pr)}</div></div><div class="stats"><div><b>${x.s.n}</b><span>Tournois</span></div><div><b>${x.s.n ? Math.round(x.s.itm) + "%" : "–"}</b><span>ITM</span></div><div><b class="${cls(x.s.roi)}">${x.s.bi ? Math.round(x.s.roi) + "%" : "–"}</b><span>ROI</span></div><div><b>${eur(-x.s.bi).replace("-", "")}</b><span>Misé</span></div><div><b>${x.s.best ? x.s.best + "e" : "–"}</b><span>Meilleure place</span></div><div><b>${x.s.avg ? x.s.avg.toFixed(1).replace(".", ",") : "–"}</b><span>Place moy.</span></div></div></div>`;
        });
        return (
          h + '<h2>Profit cumulé</h2><div class="card">' + chart() + "</div>" + kpiView() + playerView()
        );
      }
      function loginView() {
        return `<h1>♠️ MTT Tracker</h1><div class="card"><div class="name">Connexion</div><label>Email</label><input id="em" type="email" autocomplete="username" inputmode="email"><label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password"><button class="btn" id="li">Se connecter</button></div>`;
      }
      async function login() {
        const { error } = await sb.auth.signInWithPassword({
          email: $("#em").value.trim(),
          password: $("#pw").value,
        });
        if (error) toast("Email ou mot de passe incorrect.");
      }
      function setView() {
        return `<h1>⚙️ Réglages</h1><h2>Joueurs</h2><div class="card">${S.players.map((p) => `<div class="pr"><div class="nm">${esc(p.name)}</div><button class="ib ed" data-ep="${p.id}" aria-label="Modifier">${IC.edit}</button><button class="ib dl" data-dp="${p.id}" aria-label="Supprimer">${IC.del}</button></div>`).join("") || '<div class="empty">Aucun joueur.</div>'}<button class="btn alt" id="addp">+ Ajouter un joueur</button></div>
<div class="sub" style="margin:10px 4px">Données partagées en direct entre tous les appareils.</div><button class="btn alt" id="lo">Se déconnecter</button>`;
      }
      function playerSheet(p) {
        const bg = sheet(`<div class="name" style="font-size:17px">${p ? "Modifier le joueur" : "Ajouter un joueur"}</div><label>Nom</label><input id="pn" value="${esc(p ? p.name : "")}" placeholder="Ex : Nelson"><button class="btn" id="ok">${p ? "Enregistrer" : "Ajouter"}</button><button class="btn alt" id="cx">Annuler</button>`);
        bg.querySelector("#cx").onclick = () => bg.remove();
        bg.querySelector("#ok").onclick = async () => {
          const name = bg.querySelector("#pn").value.trim();
          if (!name) return toast("Le nom est obligatoire.");
          const { error } = p
            ? await sb.from("players").update({ name }).eq("id", p.id)
            : await sb.from("players").insert({ id: "p" + Date.now(), name });
          if (error) return toast("Erreur, réessaie.");
          bg.remove();
          load();
        };
      }
      function delPlayer(p) {
        if (!p) return;
        const n = statsFor(p).n;
        const bg = sheet(`<div class="name" style="font-size:17px">Supprimer ${esc(p.name)} ?</div><div class="sub" style="margin-top:6px">${n ? `Ses ${n} résultat${n > 1 ? "s" : ""} seront aussi supprimé${n > 1 ? "s" : ""}. ` : ""}Cette action est définitive.</div><button class="btn del" id="ok">Supprimer</button><button class="btn alt" id="cx">Annuler</button>`);
        bg.querySelector("#cx").onclick = () => bg.remove();
        bg.querySelector("#ok").onclick = async () => {
          const a = await sb.from("results").delete().eq("player_id", p.id);
          const b = await sb.from("players").delete().eq("id", p.id);
          if (a.error || b.error) return toast("Erreur, réessaie.");
          bg.remove();
          load();
        };
      }
      function delTournament(t, parent) {
        const bg = sheet(`<div class="name" style="font-size:17px">Supprimer « ${esc(t.name)} » ?</div><div class="sub" style="margin-top:6px">Les résultats saisis pour ce tournoi seront aussi supprimés. Cette action est définitive.</div><button class="btn del" id="ok">Supprimer</button><button class="btn alt" id="cx">Annuler</button>`);
        bg.querySelector("#cx").onclick = () => bg.remove();
        bg.querySelector("#ok").onclick = async () => {
          const a = await sb.from("results").delete().eq("tournament_id", t.id);
          const b = await sb.from("custom_tournaments").delete().eq("id", t.id);
          if (a.error || b.error) return toast("Erreur, réessaie.");
          bg.remove();
          parent.remove();
          load();
        };
      }

      function render() {
        const nv = document.querySelector("nav");
        if (!authed) {
          nv.style.display = "none";
          $("#fab").style.display = "none";
          app.innerHTML = authReady ? loginView() : "";
          return;
        }
        nv.style.display = "";
        app.innerHTML =
          (loadErr
            ? '<div class="card neg">Connexion à la base impossible (URL / clé / tables ?).</div>'
            : "") +
          (tab === "cal"
            ? calView()
            : tab === "stats"
              ? statsView()
              : setView());
        $("#fab").style.display = tab === "cal" ? "block" : "none";
        document
          .querySelectorAll("nav button")
          .forEach((b) => b.classList.toggle("on", b.dataset.t === tab));
      }
      function sheet(html) {
        const bg = document.createElement("div");
        bg.className = "sheet-bg";
        bg.innerHTML = '<div class="sheet">' + html + "</div>";
        bg.onclick = (e) => {
          if (e.target === bg) bg.remove();
        };
        document.body.appendChild(bg);
        return bg;
      }

      function resultSheet(t) {
        const cur = S.results[t.id] || { p: {} },
          ty = TYPES[t.type];
        const bg =
          sheet(`<div class="name" style="font-size:17px">${esc(t.name)}</div><div class="sub">${D(t.date).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" })} · ${ty[0]}</div>
  ${t.custom ? `<label>Date</label><input id="td" type="date" value="${esc(t.date)}"><label>Nom</label><input id="tn" value="${esc(t.name)}"><label>Lieu</label><input id="tp" value="${esc(t.place || "")}" placeholder="Adresse / ville / club">` : ""}${t.custom || t.place ? `<button class="map" id="mp">📍 Ouvrir dans Google Maps</button>` : ""}
  <label>Nombre de joueurs au tournoi</label><input id="rn" type="number" inputmode="numeric" value="${esc(cur.n || "")}">
  ${S.players
    .map((p) => {
      const r = cur.p[p.id] || {};
      return `<div class="card" style="margin-top:10px"><label class="chk"><input type="checkbox" id="pl-${p.id}" ${cur.p[p.id] ? "checked" : ""}> <b>${esc(p.name)}</b> a joué</label><div class="g3"><div><label>Buy-in (€)</label><input id="bi-${p.id}" inputmode="decimal" value="${esc(r.buyin ?? "")}"></div><div><label>Gain (€)</label><input id="ga-${p.id}" inputmode="decimal" value="${esc(r.gain ?? "")}"></div><div><label>Place</label><input id="pc-${p.id}" inputmode="numeric" value="${esc(r.place ?? "")}"></div></div></div>`;
    })
    .join("")}
  <button class="btn" id="sv">Enregistrer</button>${t.custom ? '<button class="btn del" id="dl">Supprimer ce tournoi</button>' : ""}<button class="btn alt" id="cx">Fermer</button>`);
        bg.querySelector("#cx").onclick = () => bg.remove();
        bg.querySelector("#sv").onclick = async () => {
          const p = {};
          S.players.forEach((pl) => {
            if (bg.querySelector("#pl-" + pl.id).checked)
              p[pl.id] = {
                buyin: bg.querySelector("#bi-" + pl.id).value,
                gain: bg.querySelector("#ga-" + pl.id).value,
                place: bg.querySelector("#pc-" + pl.id).value,
              };
          });
          const n = bg.querySelector("#rn").value;
          if (t.custom) {
            const d = bg.querySelector("#td").value;
            if (!d) return toast("La date est obligatoire.");
            const u = await sb.from("custom_tournaments").update({
              date: d,
              name: bg.querySelector("#tn").value.trim() || "Tournoi interclub",
              place: bg.querySelector("#tp").value.trim(),
            }).eq("id", t.id);
            if (u.error) return toast("Erreur de sauvegarde, réessaie.");
          }
          const rows = Object.entries(p).map(([pid, r]) => ({
            tournament_id: t.id,
            player_id: pid,
            buyin: num(r.buyin),
            gain: num(r.gain),
            place: parseInt(r.place) || null,
            n_players: parseInt(n) || null,
          }));
          const a = await sb.from("results").delete().eq("tournament_id", t.id);
          const b = rows.length ? await sb.from("results").insert(rows) : {};
          if (a.error || b.error)
            return toast("Erreur de sauvegarde, réessaie.");
          bg.remove();
          load();
        };
        const mp = bg.querySelector("#mp");
        if (mp)
          mp.onclick = () => {
            const q = t.custom ? bg.querySelector("#tp").value.trim() : t.place;
            if (q) window.open(mapUrl(q), "_blank");
            else toast("Renseigne d'abord un lieu.");
          };
        const dl = bg.querySelector("#dl");
        if (dl) dl.onclick = () => delTournament(t, bg);
      }
      function addSheet() {
        const bg = sheet(
          `<div class="name" style="font-size:17px">Ajouter un tournoi interclub</div><label>Date</label><input id="ad" type="date" value="${today()}"><label>Nom du tournoi</label><input id="an" placeholder="Ex : Deepstack Vierzon"><label>Lieu</label><input id="ap" placeholder="Adresse / ville / club (pour Google Maps)"><button class="btn" id="ok">Ajouter</button><button class="btn alt" id="cx">Annuler</button>`,
        );
        bg.querySelector("#cx").onclick = () => bg.remove();
        bg.querySelector("#ok").onclick = async () => {
          const date = bg.querySelector("#ad").value;
          if (!date) return;
          const { error } = await sb
            .from("custom_tournaments")
            .insert({
              id: "c" + Date.now(),
              date,
              name: bg.querySelector("#an").value.trim() || "Tournoi interclub",
              place: bg.querySelector("#ap").value.trim(),
            });
          if (error) return toast("Erreur, réessaie.");
          bg.remove();
          view = "all";
          load();
        };
      }

      document.addEventListener("click", (e) => {
        const c = e.target.closest("[data-t]"),
          v = e.target.closest("[data-v]"),
          f = e.target.closest("[data-f]"),
          n = e.target.closest("nav button");
        if (n) {
          tab = n.dataset.t;
          render();
          window.scrollTo(0, 0);
          return;
        }
        if (v) {
          view = v.dataset.v;
          render();
          return;
        }
        if (f) {
          filter = f.dataset.f;
          render();
          return;
        }
        if (e.target.closest("a")) return;
        if (c && c.classList.contains("card")) {
          const t = all().find((x) => x.id === c.dataset.t);
          if (t) resultSheet(t);
          return;
        }
        const id = e.target.id,
          ep = e.target.closest("[data-ep]"),
          dp = e.target.closest("[data-dp]"),
          sq = e.target.closest("[data-sp]");
        if (id === "li") login();
        if (id === "lo") sb.auth.signOut();
        if (id === "addp") playerSheet();
        if (ep) playerSheet(S.players.find((x) => x.id === ep.dataset.ep));
        if (dp) delPlayer(S.players.find((x) => x.id === dp.dataset.dp));
        if (sq) {
          sp = sq.dataset.sp;
          render();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target.id === "pw") login();
      });
      $("#fab").onclick = addSheet;
      const setAuth = (session) => {
        authed = !!session;
        authReady = true;
        if (!authed) S = { players: [], custom: [], results: {} };
        authed ? setTimeout(load, 0) : render();
      };
      sb.auth.onAuthStateChange((_e, session) => setAuth(session));
      sb.auth.getSession().then(({ data }) => {
        if (!authReady) setAuth(data.session);
      });
      sb.channel("sync")
        .on("postgres_changes", { event: "*", schema: "public" }, () => load())
        .subscribe();
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) load();
      });
    </script>
  </body>
</html>
